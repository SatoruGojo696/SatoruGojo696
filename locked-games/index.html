<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locked Games</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #121212; color: #eee; font-family: Arial, sans-serif; }
    .wrap { width: min(1100px, 92%); margin: 0 auto; padding: 50px 0; }
    .gate, .games { background: #1e1e1e; border: 1px solid #333; border-radius: 18px; padding: 28px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .gate { max-width: 430px; margin: 12vh auto 0; text-align: center; }
    h1 { margin-top: 0; }
    p { color: #bbb; line-height: 1.5; }
    input { width: 180px; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #111; color: #fff; text-align: center; font-size: 1.4rem; letter-spacing: .3em; outline: none; }
    button, .game { border: 0; border-radius: 10px; background: #292929; color: #fff; cursor: pointer; }
    button { margin-top: 14px; padding: 11px 20px; font-size: 1rem; }
    button:hover, .game:hover { background: #363636; }
    #error { min-height: 22px; color: #ff8585; margin: 12px 0 0; }
    .top { display: flex; justify-content: space-between; gap: 15px; align-items: center; margin-bottom: 20px; }
    .top h1 { margin: 0; }
    .top button { margin: 0; }
    #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
    .game { overflow: hidden; text-decoration: none; display: flex; flex-direction: column; min-height: 210px; }
    .game img { width: 100%; height: 150px; object-fit: cover; background: #111; }
    .game span { padding: 15px; text-align: center; font-weight: 600; }
    .empty { color: #aaa; text-align: center; grid-column: 1 / -1; padding: 30px; }
    .hidden { display: none; }
    a.back { color: #aaa; display: inline-block; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="gate" class="gate">
      <h1>🔒 Locked Games</h1>
      <p>Enter the 4-digit code to open this game folder.</p>
      <input id="code" type="text" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" aria-label="4 digit access code">
      <br>
      <button id="unlock">Unlock</button>
      <div id="error"></div>
      <a class="back" href="../">← Back to Vertex 3</a>
    </section>
    <section id="gameSection" class="games hidden">
      <div class="top">
        <h1>🔓 Locked Games</h1>
        <button id="lock">Lock</button>
      </div>
      <div id="games"></div>
      <a class="back" href="../">← Back to Vertex 3</a>
    </section>
  </div>
  <script>
    // Change this to your own 4-digit code.
    // This is a client-side lock, so it is NOT a secure password system.
    const ACCESS_CODE = "4827";
    const SESSION_KEY = "Vertex3.lockedGamesUnlocked";
    const gate = document.getElementById("gate");
    const gameSection = document.getElementById("gameSection");
    const codeInput = document.getElementById("code");
    const error = document.getElementById("error");
    const gamesContainer = document.getElementById("games");
    function showGames() { gate.classList.add("hidden"); gameSection.classList.remove("hidden"); loadGames(); }
    function unlock() {
      const code = codeInput.value.trim();
      if (!/^\d{4}$/.test(code)) { error.textContent = "Enter exactly 4 digits."; return; }
      if (code !== ACCESS_CODE) { error.textContent = "Wrong code."; codeInput.select(); return; }
      sessionStorage.setItem(SESSION_KEY, "true"); error.textContent = ""; showGames();
    }
    function lock() { sessionStorage.removeItem(SESSION_KEY); location.reload(); }
    async function loadGames() {
      try {
        const response = await fetch("games.json?" + Date.now());
        if (!response.ok) throw new Error("Could not load games.json");
        const games = await response.json();
        gamesContainer.innerHTML = "";
        if (!games.length) {
          gamesContainer.innerHTML = "<div class=\"empty\">No locked games yet. Add a game to <code>locked-games/games/</code> and then add it to <code>games.json</code>.</div>";
          return;
        }
        for (const game of games) {
          const card = document.createElement("a"); card.className = "game"; card.href = game.url;
          const img = document.createElement("img"); img.src = game.icon || "../icon/web-port.svg"; img.alt = game.name;
          const title = document.createElement("span"); title.textContent = game.name;
          card.append(img, title); gamesContainer.appendChild(card);
        }
      } catch (err) {
        console.error(err); gamesContainer.innerHTML = "<div class=\"empty\">Could not load the locked games list.</div>";
      }
    }
    document.getElementById("unlock").addEventListener("click", unlock);
    document.getElementById("lock").addEventListener("click", lock);
    codeInput.addEventListener("keydown", event => { if (event.key === "Enter") unlock(); });
    if (sessionStorage.getItem(SESSION_KEY) === "true") showGames();
  </script>
</body>
</html>
