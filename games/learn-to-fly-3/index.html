<html>
  <head><base href="https://cdn.jsdelivr.net/gh/SatoruGojo696/supercoolsite@0932d9e90bedb04e308d9ba23aab6a535a25af9c/learn-to-fly-3/">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learn to Fly 3</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #ruffle {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <script src="/js/main.js"></script>
    <div id="ruffle"></div>
    <script src="https://ruffle-bay.vercel.app/ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("learn-to-fly-3.swf");
      });
    </script>
  </body>
</html>
