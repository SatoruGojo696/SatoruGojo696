<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinosaur Game 2</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f7f7f7;font-family:Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{width:min(100vw,1100px);padding:20px;box-sizing:border-box}
  #hud{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:8px;color:#555}
  canvas{display:block;width:100%;height:auto;background:#fff;border-bottom:2px solid #555}
  #hint{text-align:center;color:#777;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span id="state">Press Space / ↑ to start</span><span id="score">00000</span></div>
  <canvas id="game" width="1000" height="300"></canvas>
  <div id="hint">Space / ↑ / click / tap = jump · R = restart</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stateEl = document.getElementById('state');
  const scoreEl = document.getElementById('score');

  const dino = {x:70,y:230,w:34,h:42,vy:0,onGround:true};
  let obstacles=[], clouds=[], running=false, gameOver=false, score=0, speed=6, last=0, spawn=0;

  function reset(){
    dino.y=230; dino.vy=0; dino.onGround=true;
    obstacles=[]; clouds=[]; score=0; speed=6; spawn=0;
    running=false; gameOver=false;
    stateEl.textContent='Press Space / ↑ to start';
    scoreEl.textContent='00000';
    draw();
  }

  function start(){
    if(gameOver) reset();
    running=true; gameOver=false;
    stateEl.textContent='RUN!';
    if(!last) requestAnimationFrame(loop);
  }

  function jump(){
    if(!running){ start(); }
    if(dino.onGround){
      dino.vy=-14;
      dino.onGround=false;
    }
  }

  function spawnObstacle(){
    const tall=Math.random()<0.22;
    obstacles.push({x:canvas.width+20,y:tall?195:215,w:tall?24:20,h:tall?55:35});
  }

  function hit(a,b){
    return a.x+6 < b.x+b.w && a.x+a.w-6 > b.x &&
           a.y+5 < b.y+b.h && a.y+a.h > b.y+5;
  }

  function drawDino(){
    ctx.fillStyle='#333';
    ctx.fillRect(dino.x+6,dino.y+10,22,28);
    ctx.fillRect(dino.x+20,dino.y+2,16,18);
    ctx.fillStyle='#fff';
    ctx.fillRect(dino.x+29,dino.y+6,3,3);
    ctx.fillStyle='#333';
    ctx.fillRect(dino.x+4,dino.y+34,8,8);
    ctx.fillRect(dino.x+22,dino.y+34,8,8);
    ctx.fillRect(dino.x,dino.y+20,9,6);
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ddd';
    for(const c of clouds){
      ctx.fillRect(c.x,c.y,c.w,5);
      ctx.fillRect(c.x+10,c.y-5,25,10);
    }
    ctx.fillStyle='#777';
    ctx.fillRect(0,272,canvas.width,2);
    for(const o of obstacles){
      ctx.fillRect(o.x,o.y,o.w,o.h);
      if(o.h>40){ctx.fillRect(o.x-7,o.y+15,7,5);ctx.fillRect(o.x+o.w,o.y+25,7,5);}
    }
    drawDino();
    if(gameOver){
      ctx.fillStyle='#333'; ctx.font='bold 28px Arial'; ctx.textAlign='center';
      ctx.fillText('GAME OVER',canvas.width/2,125);
      ctx.font='16px Arial'; ctx.fillText('Press R or click to restart',canvas.width/2,155);
      ctx.textAlign='left';
    }
  }

  function loop(t){
    last=t;
    if(!running){draw();return;}
    const dt=Math.min((t-last+16.67)/16.67,2);
    dino.vy += 0.75*dt;
    dino.y += dino.vy*dt;
    if(dino.y>=230){dino.y=230;dino.vy=0;dino.onGround=true;}

    spawn += dt;
    if(spawn > Math.max(45,95-score/80)){
      spawn=0; spawnObstacle();
    }
    speed=Math.min(12,6+score/1200);
    for(const o of obstacles) o.x -= speed*dt;
    obstacles=obstacles.filter(o=>o.x+o.w>-20);

    if(Math.random()<0.015) clouds.push({x:canvas.width+20,y:40+Math.random()*70,w:45});
    for(const c of clouds)c.x-=1.5*dt;
    clouds=clouds.filter(c=>c.x+c.w>-10);

    for(const o of obstacles){
      if(hit(dino,o)){
        running=false; gameOver=true;
        stateEl.textContent='Game Over';
      }
    }

    score += dt;
    scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');
    draw();
    if(running) requestAnimationFrame(loop);
  }

  addEventListener('keydown',e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
    if(e.key.toLowerCase()==='r'){reset();start();}
  });
  canvas.addEventListener('pointerdown',()=>gameOver ? (reset(),start()) : jump());
  reset();
})();
</script>
</body>
</html>
