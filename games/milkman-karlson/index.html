<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Milkman Karlson</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    iframe{display:block;width:100%;height:100%;border:0}
    #error{display:none;color:#fff;font:16px system-ui;padding:24px}
  </style>
</head>
<body>
  <div id="error"></div>
  <iframe id="game" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe>
  <script>
    (async () => {
      const slug = "milkman-karlson";
      const commit = "a8bea5fd11f88e5a9192857f434e299c40efe7e6";
      const source = `https://cdn.jsdelivr.net/gh/SatoruGojo696/web-port@${commit}/${slug}/index.html`;
      const base = `https://cdn.jsdelivr.net/gh/SatoruGojo696/web-port@${commit}/${slug}/`;
      const error = document.getElementById("error");
      try {
        const response = await fetch(source, {cache:"no-store"});
        if (!response.ok) throw new Error("HTTP " + response.status);
        let html = await response.text();
        if (/<base\s/i.test(html)) {
          html = html.replace(/<base\s+[^>]*>/i, `<base href="${base}">`);
        } else {
          html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${base}">`);
        }
        const blob = new Blob([html], {type:"text/html"});
        document.getElementById("game").src = URL.createObjectURL(blob);
      } catch (e) {
        error.style.display = "block";
        error.textContent = "GAME FAILED TO LOAD: " + e.message;
      }
    })();
  </script>
</body>
</html>
